# 排除第三方 / 二进制资产，避免 GitHub 密钥扫描（含 Push Protection）误报。
# 背景：libs/transformers.min.js 是官方 Transformers.js 打包产物，内含大量
# 32 位模型类名（如 Mistral3ForConditionalGeneration），会被误判为
# "Mistral AI API Key" 而拦下 git push。官方机制说明：
# https://docs.github.com/en/code-security/how-tos/secure-your-secrets/customize-leak-detection/exclude-folders-and-files
# 仅排除三方库与模型二进制；自研源码（含 .github/workflows、exe-build）仍全部扫描。
paths-ignore:
  - "libs/**"
  - "models/**"
